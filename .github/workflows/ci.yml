name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-diagnostics:
    name: Environment & Pre-Flight Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run CI Pipeline Validator
        run: |
          python utils/ci_pipeline_validator.py

  lint:
    name: Code Linting & Style Enforcement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Flake8 Critical Error Check
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Black Code Formatting Check
        run: black --check .
        continue-on-error: true

      - name: Run Isort Import Sorting Check
        run: isort --check-only .
        continue-on-error: true

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit

      - name: Run Bandit AST Security Scan
        run: bandit -r agents utils app.py -ll || true

      - name: Run Safety Dependency Check
        run: safety check || true

  syntax-validation:
    name: Syntax & Bytecode Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Runtime Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Core Modules
        run: |
          python -m py_compile app.py config.py prompts.py
          for file in agents/*.py; do python -m py_compile "$file"; done
          for file in utils/*.py; do python -m py_compile "$file"; done
        env:
          FLASK_SECRET_KEY: ci-compilation-token-test

  matrix-testing:
    name: Automated Test Matrix (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [environment-diagnostics, syntax-validation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Execute Automated Test Suite
        run: |
          pytest --cov=agents --cov=utils --cov-report=term-missing --cov-report=xml:coverage.xml
        env:
          FLASK_SECRET_KEY: ci-matrix-secret-key-2026
          TESTING: 'true'

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 7
