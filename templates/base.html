<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AI Campus Placement Agent{% endblock %}</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Top Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-2" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand text-primary fw-bold" href="/">
        <i class="fa-solid fa-graduation-cap me-1"></i> AI Campus Placement
      </a>
      <div class="ms-auto d-flex gap-2">
        <a href="/" class="btn btn-sm btn-outline-secondary">Home</a>
        <a href="/history" class="btn btn-sm btn-outline-secondary">History</a>
        <a href="/search" class="btn btn-sm btn-outline-primary"><i class="fas fa-search me-1"></i>Search</a>
      </div>
    </div>
  </nav>

  <!-- Main Content Container -->
  <main class="py-3">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
